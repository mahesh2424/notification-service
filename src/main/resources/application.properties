spring.application.name=notification-service
server.port=8082
spring.datasource.url=jdbc:postgresql://localhost:5432/notification
spring.datasource.username=ticketing
spring.datasource.password=${DB_PASSWORD:ticketing}
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
ticketing.kafka.enabled=false
ticketing.kafka.topic=booking.reservation-events
ticketing.kafka.dlq-topic=booking.reservation-events.dlq
spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration
